<title>Задачка 1</title>
</head>
<body bgcolor="#66FFFF">
<div style="text-align: center;">
  <p><br>import turtle as t
<br>t.tracer(0)
<br>t.left(90)
<br>t.screensize(10000, 10000)
<br>k = 30
<br>for i in range(5):
    <br>t.right(45)
    <br>t.forward(10*k)
    <br>t.right(45)
<br>for i in range(6):
    <br>t.forward(20*k)
    <br>t.right(90)
<br>t.up()
<br>for x in range(0, 28):
    <br>for y in range(-13, 8):
        <br>t.goto(x*k, y*k)
        <br>t.dot(4, "red")
<br>t.update()
<br>t.done()    

</p>
</div>
</body>
</html>
