<title>Задачка 1</title>
</head>
<body bgcolor="#66FFFF">
<div style="text-align: center;">
  <p>import turtle as t 
<br>t.tracer(0) 
<br>t.left(90) 
<br>t.screensize(10000, 10000) 
<br>k = 30 
<br>
<br>for i in range(7):
    <br>t.forward(10*k)
    <br>t.right(120)
<br>
<br>t.up()
<br>
<br>for x in range(-5, 20):
    <br>for y in range(0, 20):
        <br>t.goto(x*k, y*k)
        <br>t.dot(4, "red") 
<br>t.update() 
<br>t.done() 
<br>
<br>

</div>
</body>
</html>
